<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ein Logbuch für deine Flüge</title>
  <meta name="description" content="Eine App, mit der du deine Flugreisen festhältst – als Liste, auf der Weltkarte und in Zahlen. Die Website entsteht gerade.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2313243a'/><path d='M7 22 Q16 4 25 22' fill='none' stroke='%237fb0e6' stroke-width='2.5' stroke-linecap='round'/><circle cx='7' cy='22' r='2.5' fill='%23eef3f8'/><circle cx='25' cy='22' r='2.5' fill='%23eef3f8'/></svg>">
  <style>
    :root {
      --bg: #eef3f8;
      --ink: #13243a;
      --muted: #56677c;
      --route: #3b6ea8;
      --dot: #13243a;
      --line: #c6d2de;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1a29;
        --ink: #e4ecf4;
        --muted: #8fa1b5;
        --route: #7fb0e6;
        --dot: #e4ecf4;
        --line: #263649;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      padding: clamp(1.5rem, 5vw, 4rem);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 44rem;
    }

    .route {
      width: min(100%, 26rem);
      height: auto;
      margin-bottom: clamp(1.5rem, 4vh, 2.5rem);
      overflow: visible;
    }
    .route path {
      fill: none;
      stroke: var(--route);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: fly 2.4s cubic-bezier(.45, 0, .2, 1) .3s forwards;
    }
    .route .trail {
      stroke: var(--line);
      stroke-dasharray: 0.012 0.024;
      stroke-dashoffset: 0;
      animation: none;
    }
    .route circle { fill: var(--dot); }
    .route .label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      fill: var(--muted);
    }

    @keyframes fly { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .route path { animation: none; stroke-dashoffset: 0; }
    }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(2.25rem, 7vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    p {
      margin: 1.25rem 0 0;
      max-width: 36ch;
      color: var(--muted);
    }

    footer {
      margin-top: clamp(3rem, 10vh, 5rem);
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-size: 0.875rem;
      color: var(--muted);
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
    }
    a:hover { color: var(--ink); }
    a:focus-visible {
      outline: 2px solid var(--route);
      outline-offset: 3px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <main>
    <svg class="route" viewBox="0 0 400 140" role="img" aria-label="Flugroute von Hamburg nach New York">
      <path class="trail" d="M30 110 Q200 -10 370 110" pathLength="1"/>
      <path d="M30 110 Q200 -10 370 110" pathLength="1"/>
      <circle cx="30" cy="110" r="5"/>
      <circle cx="370" cy="110" r="5"/>
      <text class="label" x="30" y="136" text-anchor="middle">HAM</text>
      <text class="label" x="370" y="136" text-anchor="middle">JFK</text>
    </svg>

    <h1>Ein Logbuch für deine Flüge.</h1>
    <p>Hier entsteht die Website zu einer App, mit der du deine Flugreisen festhältst: als Liste, auf der Weltkarte und in Zahlen. Bald gibt es hier mehr.</p>
  </main>

  <footer>
    Ein Projekt von <a href="https://kippenberger.me">Maurice Kippenberger</a>
  </footer>
</body>
</html>
